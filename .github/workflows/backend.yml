name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

env:
  GO_VERSION: '1.23.3'
  IMAGE_NAME: sel_backend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod tidy

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gf CLI
        run: go install github.com/gogf/gf/cmd/gf/v2@v2.8.1

      - name: Verify dependencies
        run: go mod verify

      - name: Build binary
        run: make build

      - name: Build Docker image
        run: |
          mkdir -p docker-context
          cp ./main docker-context/main
          cp manifest/docker/Dockerfile docker-context/Dockerfile
          docker build -t ${{ env.IMAGE_NAME }} docker-context

      - name: Save Docker image
        run: |
          mkdir -p tmp
          docker save ${{ env.IMAGE_NAME }} -o tmp/backend.tar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts
          path: |
            backend/tmp/backend.tar
            backend/manifest/deploy/docker-compose.yaml
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: main
      url: ${{ vars.ENV_URL }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-artifacts

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa

      - name: Verify SSH connection
        run: |
          ssh \
            -o "ProxyCommand=/usr/local/bin/cloudflared access ssh --hostname ${{ secrets.DEPLOY_HOST }} \
              --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} \
              --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "echo SSH via Cloudflare Access succeeded"

      - name: Upload files to server
        run: |
          scp \
            -o "ProxyCommand=/usr/local/bin/cloudflared access ssh --hostname ${{ secrets.DEPLOY_HOST }} \
              --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} \
              --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -o StrictHostKeyChecking=no \
            backend/tmp/backend.tar \
            backend/manifest/deploy/docker-compose.yaml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_TARGET }}

      - name: Restart Docker stack
        run: |
          ssh \
            -o "ProxyCommand=/usr/local/bin/cloudflared access ssh --hostname ${{ secrets.DEPLOY_HOST }} \
              --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} \
              --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "bash -c \"
              cd ${{ secrets.DEPLOY_TARGET }} &&
              docker compose down || true &&
              docker system prune -f &&
              docker rmi ${{ env.IMAGE_NAME }} || true &&
              docker load -i ./backend.tar &&
              docker compose up -d
            \""
